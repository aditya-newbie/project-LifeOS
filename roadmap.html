<!DOCTYPE html>
<html>
  <head>
    <title>
      Roadmap
    </title>

    <link rel="stylesheet" href="styles/roadmap.css">
  </head>
  <body>
    <main>
      <section class="stage-details">
        <div class="details-left-section">
          <div class="stage-icon-container">
            <div class="stage-icon-background">
              <svg
                class="stage-icon-map"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
              <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" />
              <path d="M15 5.764v15" />
              <path d="M9 3.236v15" />
              </svg>
            </div>
          </div>
          <div class="left-section-text">
            <p class="stage-number">Stage 1 of 5</p>
            <p class="stage-name js-stage-name"></p>
            <p class="stage-description js-stage-description"></p>
          </div>
          <hr class="stage-detail-devider-line">
        </div>
        <div class="details-right-section">
          <div class="milestone-count-container">
            <div class="milestone-icon-background">
              <svg
                class="flag-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528" />
              </svg>
            </div>
            <div class="milestone-count-text">
              <p class="milestone-text">Milestones</p>
              <p class="milestone-count js-milestone-count">5</p>
            </div>
          </div>
          <div class="start-date-container">
            <div class="start-date-icon-background">
              <svg class="calender-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-icon lucide-calendar"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
            </div>
            <div class="start-date-text-container">
              <p class="start-date-text">Start Date</p>
              <p class="started-on js-started-on">15 AUG 2026</p>
            </div>
          </div>
        </div>
      </section>
      <section class="milestone-container">
        <div class="milestone-heading">
          <svg
            class="flag-icon milestone-heading-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528" />
          </svg>  
          
          <h2 class="milestone-heading-text">MILESTONE</h2>
        </div>
        <div class="milestone-card-container js-milestone-card-container">
          
        </div>
        <button class="add-milestone-button js-add-milestone-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="plus-icon lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <p class="add-milestone-text">Add Milestone</p>
        </button>
        <dialog class="add-milestone-popup js-add-milestone-popup">
          <div class="add-milestone-flexbox">
            <input class="milestone-name-input js-milestone-name-input" type="text" placeholder="Milestone Name">
            <textarea class="milestone-description-input js-milestone-description-input" placeholder="Milestone Description"></textarea>
            <div class="add-milestone-popup-button-container">
              <button class="save-milestone-button js-save-milestone-button">Save Milestone</button>
            </div>
          </div>
        </dialog>
      </section>
    </main>

    <script type="module" src="script/roadmap.js"></script>
  </body>
</html>
