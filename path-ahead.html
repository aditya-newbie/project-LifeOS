<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      Path-Ahead
    </title>

    <link rel="stylesheet" href="styles/path-ahead.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/responsive/responsive-general.css">
    <link rel="stylesheet" href="styles/responsive/responsive-header.css">
    <link rel="stylesheet" href="styles/responsive/resonsive-path-ahead.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  </head>
  <body>
    <header>
      <div class="header-left-section">
        <div class="lifeos-logo-container">
          <img src="images/LifeOS-icon-only.svg" class="lifeos-logo">
          <p class="lifeos-logo-text">LifeOS</p>
        </div>
      </div>

      <div class="header-middle-section">
        <a class="header-anchor" href="index.html">Home</a>
        <a class="header-anchor" href="path-ahead.html">Path Ahead</a>
      </div>

      <div class="header-right-section">
        <img src="images/login_button.svg" class="header-login">
      </div>
    </header>

    <main id="path-ahead">
      <h2 class="path-ahead-heading">Path Ahead</h2>

      <div class="field-selector js-field-selector"></div>

      <dialog class="add-field-popup js-add-field-popup">
        <button class="back-popup-button js-back-popup-button">
          <img style="width: 100%;" src="images/arrow-left.svg">
        </button>
        
        <div class="popup-input-container" >
         
          <div class="fieldicon-input-container">
             <label class="fieldicon-label" for="fieldicon-input">
              Field <br>
              icon
            </label>

            <svg class="fieldicon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            
            <input class="fieldicon-input js-fieldicon-input" id="fieldicon-input" type="file" accept="image/png, image/svg+xml" aria-label="Upload field icon">

            <p class="optional-label">
              optional
            </p>
          </div>
          
          <label for="fieldname-input" class="fieldname-label">
            Enter field name
          </label>
          <input class="fieldname-input js-fieldname-input" id="fieldname-input" placeholder="e.g: Finance">
        </div>
        <button class="add-field-button js-add-field-button">Add</button>
      </dialog>

      <div class="create-stage-popup js-create-stage-popup">
        <button class="cancel-create-stage js-cancel-create-stage">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div class="create-stage-title">
          <p class="create-stage-txt">Create New Stage</p>
          <img src="images/stage-icon.svg" class="create-stage-icon">
        </div>

        <div class="create-stage-name">
          <input class="create-stage-name-input js-create-stage-name-input" placeholder="Stage name">
          <p class="create-stage-name-txt">
            A short name that represents this stage
          </p>
        </div>

        <hr class="create-stage-devider">

        <textarea class="create-stage-description js-create-stage-description" placeholder="write a description , a project brief, or collected ideas"></textarea>

        <button class="save-stage-button js-save-stage-button">
          Create 
          <svg class="create-stage-arrow" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right-icon lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="dialog-toast js-dialog-toast">
        <p class="dialog-toast-main js-dialog-toast-main">
          Content Content Content
        </p>
        <p class="dialog-toast-secondary js-dialog-toast-secondary">
          Description Description Description 
        </p>
      </div>

      <section class="field-stage-cards-container js-field-stage-cards-container">
        <button class="field-left-button js-field-left-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="field-stages-wrapper js-field-stages-wrapper"></div>

        <button class="field-right-button js-field-right-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </section>
    </main>


    <script type="module" src="script/path-ahead.js"></script>
  </body>
</html>
